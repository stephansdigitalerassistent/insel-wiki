name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --legacy-peer-deps && npm run build
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyBIeAMBZePPoKmvsy-yBdhnNow9vxYX1EU"
          VITE_FIREBASE_AUTH_DOMAIN: "insel-wiki.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "insel-wiki"
          VITE_FIREBASE_STORAGE_BUCKET: "insel-wiki.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "485637054444"
          VITE_FIREBASE_APP_ID: "1:485637054444:web:b11ab31e2f31b0fb136ac9"
          VITE_FIREBASE_MEASUREMENT_ID: "G-MYMGER7S1R"
          VITE_GEMINI_API_KEY: "${{ secrets.VITE_GEMINI_API_KEY }}"
      # Install + unit-test the Cloud Functions. A failure here fails the job
      # before any deploy, so we never ship a half (frontend without function).
      - name: Install & test functions
        run: npm ci && npm test
        working-directory: functions
      # Deploy rules and functions BEFORE hosting: the frontend no longer writes the
      # markdown `content` field, so the server-side projection function must be
      # live first to keep search/history fresh.
      - name: Deploy to Firebase
        run: |
          ACCESS_TOKEN=$(node get-token.js)
          FIREBASE_TOKEN=$ACCESS_TOKEN npx firebase deploy --project insel-wiki --non-interactive
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INSEL_WIKI }}
